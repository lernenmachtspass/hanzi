html,body{margin:0;min-height:100%}

h1{font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:1px}
.stars{background:var(--card);border-radius:99px;padding:8px 18px;font-size:20px;box-shadow:var(--shadow)}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s,filter .15s}

.bar{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.back{background:var(--card);border-radius:99px;padding:9px 20px;font-size:20px;box-shadow:var(--shadow)}

.cell{background:var(--card);border-radius:24px;aspect-ratio:1;font-size:46px;position:relative;box-shadow:var(--shadow);color:var(--ink)}
.cell:hover{transform:translateY(-3px)}
.cell.done{background:linear-gradient(160deg,rgba(31,191,152,.18),var(--card))}
.cell.done::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#1B5E4A;font:700 13px/20px sans-serif}
.cell i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:18px}
.card{background:var(--card);border-radius:36px;padding:22px 18px;display:grid;gap:16px;justify-items:center;box-shadow:var(--shadow)}
.media{display:flex;gap:14px;flex-wrap:nowrap;justify-content:center;align-items:center;width:100%}

.pic img,.pic video{width:100%;height:100%;object-fit:contain}
.bigchar{font-size:min(36vw,190px);flex:none;line-height:1;background:linear-gradient(160deg,#FF8FAE,#9A7BF0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.word{font-size:26px;color:var(--soft)}

.result .e{font-size:100px}

.poem{max-width:560px;width:100%}

.ln{font-size:min(9vw,44px)}

/* ===== 进度导出 / 导入 ===== */
function exportSave(){
  const data=JSON.stringify({v:2,theme:S.theme,themeChosen:S.themeChosen,data:ALL});
  const code=btoa(unescape(encodeURIComponent(data)));
  const ov=h('div','ov'),bx=h('div','card poem');
  const ta=h('textarea','');
  ta.value=code;
  ta.style.cssText='width:100%;height:140px;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:10px;font-family:monospace;resize:vertical';
  const tip=h('div','word','复制下面这段文字保存好，换设备时粘贴回来即可恢复');
  const row=h('div','row');
  const cp=h('button','btn','📋 复制');cp.style.background='var(--sky)';
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(code);cp.textContent='✅ 已复制'}
    catch(e){ta.select();document.execCommand('copy');cp.textContent='✅ 已复制'}
  };

  // 下载按钮
  const dl=h('button','btn','⬇️ 下载');
  dl.style.background='var(--sky)';
  dl.onclick=()=>{
    // 获取当前时间，格式：1999年09月09日23时23分23秒
    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const filename=
      now.getFullYear()+'年'+
      pad(now.getMonth()+1)+'月'+
      pad(now.getDate())+'日'+
      pad(now.getHours())+'时'+
      pad(now.getMinutes())+'分'+
      pad(now.getSeconds())+'秒.txt';

    // 创建 TXT 文件并触发下载
    const blob=new Blob([code],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    // 释放临时 URL
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    dl.textContent='✅ 已下载';
    setTimeout(()=>dl.textContent='⬇️ 下载',1000);
  };
  
  const cl=h('button','btn','关闭');cl.style.background='var(--coral)';cl.onclick=()=>ov.remove();
  row.append(cp,dl,cl);
  bx.append(h('div','q','💾 保存进度'),tip,ta,row);
  ov.append(bx);document.body.append(ov);
}
function importSave(){
  const ov=h('div','ov'),bx=h('div','card poem');
  const ta=h('textarea','');
  ta.placeholder='把之前保存的文字粘贴到这里';
  ta.style.cssText='width:100%;height:140px;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:10px;font-family:monospace;resize:vertical';
  const msg=h('div','word','');
  const row=h('div','row');
  const ok=h('button','btn','恢复');ok.style.background='var(--leaf)';
  ok.onclick=()=>{
    try{
      const raw=decodeURIComponent(escape(atob(ta.value.trim())));
      const obj=JSON.parse(raw);
      if(!obj||obj.v!==2||!obj.data)throw new Error('格式不对');
      ALL=obj.data;
      S.theme=obj.theme||'train';
      S.themeChosen=!!obj.themeChosen;
      loadTheme();
      save();
      applyTheme();
      ov.remove();
      home();

    }catch(e){
      msg.textContent='❌ 这段文字无法识别，请检查是否复制完整';
    }
  };
  const cl=h('button','btn','取消');cl.style.background='var(--coral)';cl.onclick=()=>ov.remove();
  row.append(ok,cl);
  bx.append(h('div','q','📥 恢复进度'),ta,msg,row);
  ov.append(bx);document.body.append(ov);
}

let CUR,M={};
fetch('assets/audio/manifest.json').then(r=>r.ok?r.json():{}).then(j=>{M=j||{}}).catch(()=>{});
function silence(){try{speechSynthesis.cancel()}catch(e){}try{CUR&&CUR.pause()}catch(e){}}
function say(c){speakText(P[c]?`${c}。${P[c][1]}`:c)}
function speakText(w,rate,onend){
  silence();
  let finished=false,backup=null;
  const done=()=>{if(finished)return;finished=true;if(backup)clearTimeout(backup);if(typeof onend==='function')onend()};
  backup=setTimeout(done,Math.max(5000,String(w||'').length*850));
  if(M[w]){
    const a=new Audio('assets/audio/'+M[w]);CUR=a;
    a.onended=done;a.onerror=()=>tts(w,rate,done);a.play().catch(()=>tts(w,rate,done));return;
  }
  tts(w,rate,done);
}
function bestVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/zh|cmn/i.test(v.lang));
  const sc=v=>/natural|neural|online/i.test(v.name)?5:/premium|enhanced|siri|xiaoxiao|xiaoyi|yunxi/i.test(v.name)?4:/google/i.test(v.name)?3:/tingting|meijia|huihui|female|女/i.test(v.name)?2:1;
  return vs.sort((x,y)=>sc(y)-sc(x))[0];
}
function tts(w,rate,onend){
  try{
    const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';
    const v=bestVoice();if(v)u.voice=v;
    u.pitch=1;u.rate=rate||.65;
    let fired=false;const finish=()=>{if(fired)return;fired=true;if(typeof onend==='function')onend()};
    u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);
  }catch(e){if(typeof onend==='function')onend()}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=ok?[660,880,1100]:[220];n.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.15)})}catch(e){}}

function showCard(lv,i){
  const list=LV[lv],c=list[i];S.done[c]=1;save();say(c);

  mk('🖍️ 描红','var(--leaf)',()=>trace());
  if(i>0)mk('⬅️','var(--leaf)',()=>card_(lv,i-1));
  mk(i<list.length-1?'下一个 ➡️':'🎉 完成本关','var(--coral)',()=>{
    if(i<list.length-1)return card_(lv,i+1);
    beep(true);unlockAndPlay(lv);
  });
  card.append(r);app.append(card);
  function anim(){try{writer.animateCharacter()}catch(e){}}
  function trace(){try{
    writer.cancelQuiz();
    writer.quiz({leniency:1.6,showHintAfterMisses:2,highlightOnComplete:true,onComplete:()=>{beep(true);tip.textContent='太棒了，描好啦！🎉 点「描红」再描一次'}});
    tip.textContent='用手指沿着浅色的字，一笔一笔描';
  }catch(e){}}
  try{writer=HanziWriter.create('writer',c,{width:220,height:220,padding:16,strokeColor:'#FF7FA0',radicalColor:'#7FB6F5',strokeAnimationSpeed:.5,delayBetweenStrokes:600,showOutline:true,outlineColor:'#E3CFD9',drawingWidth:18,drawingColor:'#FF7FA0',highlightColor:'#7ED7B6',onLoadCharDataError:()=>{w.style.display='none'}});anim()}catch(e){w.style.display='none'}
  function card_(a,b){showCard(a,b)}
}

/* ===== 关末解锁：每关古诗；每3关故事 ===== */
function unlockAndPlay(level){
  const T=curTheme();
  const pi=lessonPoem(T.id,level);
  addLib('p:'+pi);
  const isStoryLevel=(level+1)%3===0;
  let si=null;
  if(isStoryLevel){si=Math.min(Math.floor(level/3),29);addLib(`s:${T.id}:${si}`);}
  const back={label:'返回学习',fn:()=>learn(level)};
  if(si!=null){
    poemTheater(pi,{label:`${T.n}小故事`,fn:()=>storyTheater(T.id,si,back)});
  }else{
    poemTheater(pi,back);
  }
}

function quiz(mode){
  const learned=CHARS.filter(c=>S.done[c]);
  const pool=mode==='pic'?learned.filter(c=>P[c]):learned;
  const base=mode==='pic'?PIC:CHARS;
  if(!pool.length){
    app.innerHTML='';
    const m=h('div','card result',`<div class="e">📚</div><div class="q">还没有学过的字，先去学习吧！</div>`);
    const b=h('button','btn','去学习');b.style.background='var(--sky)';b.onclick=()=>learn(0);m.append(b);app.append(m);return;
  }
  const qs=shuffle(pool).slice(0,15);let n=0,right=0;
  function next(){
    app.innerHTML='';
    if(n>=qs.length)return end();
    const c=qs[n];
    const others=[...new Set([...shuffle(pool.filter(x=>x!==c)),...shuffle(base.filter(x=>x!==c))])].slice(0,2);
    const opts=shuffle([c,...others]);
    const bar=h('div','bar');const bk=h('button','back','← 退出');bk.onclick=testMenu;
    const pr=h('div','prog',`<b style="width:${n/qs.length*100}%"></b>`);bar.append(bk);app.append(bar,pr);
    const card=h('div','card');
    if(mode==='pic'){card.append(media(c));card.append(h('div','q','这是哪个字？'))}
    else{const b=h('button','btn','🔊 再听一遍');b.style.background='var(--sky)';b.onclick=()=>say(c);card.append(h('div','q','听一听，是哪个字？'),b);setTimeout(()=>say(c),900)}
    const o=h('div','opts');
    opts.forEach(x=>{const b=h('button','opt han',x);b.onclick=()=>{
      if(card.dataset.lock)return;
      if(x===c){card.dataset.lock=1;b.classList.add('ok');beep(true);right++;S.stars++;save();say(c);setTimeout(()=>{n++;next()},1900)}
      else{b.classList.add('no');beep(false)}}
      o.append(b)});
    card.append(o);app.append(card);
  }
  function end(){
    const e=right>=9?'🏆':right>=6?'🥳':'💪';
    const r=h('div','card result',`<div class="e">${e}</div><div class="q">答对 ${right} / ${qs.length}，得到 ${right} 颗星！</div>`);
    const row=h('div','row');
    const a=h('button','btn','再玩一次');a.style.background='var(--coral)';a.onclick=()=>quiz(mode);
    const b=h('button','btn','回首页');b.style.background='var(--sky)';b.onclick=home;
    row.append(a,b);r.append(row);app.append(r);beep(true);setTimeout(giveSticker,900);
  }
  next();
}

/* ===== emoji 转插画 ===== */
const ERE=/\p{Extended_Pictographic}(?:\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
const OM='https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/';
const hexOf=e=>[...e].map(c=>c.codePointAt(0).toString(16).toUpperCase()).join('-');
function mkImg(e){
  const i=document.createElement('img');i.className='em';i.alt=e;i.draggable=false;
  let h=hexOf(e),tried=0;i.src=OM+h+'.svg';
  i.onerror=()=>{if(!tried&&h.includes('-FE0F')){tried=1;i.src=OM+h.replace(/-FE0F/g,'')+'.svg'}else i.replaceWith(document.createTextNode(e))};
  return i;
}
function conv(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];
  while(w.nextNode()){const n=w.currentNode;if(!/^(SCRIPT|STYLE|TITLE)$/.test(n.parentNode.nodeName)&&n.nodeValue.search(ERE)>=0)L.push(n)}
  L.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let last=0;
    t.replace(ERE,(m,idx)=>{if(idx>last)f.append(t.slice(last,idx));f.append(mkImg(m));last=idx+m.length});
    if(last<t.length)f.append(t.slice(last));n.replaceWith(f);});
}
const mo=new MutationObserver(()=>{mo.disconnect();conv(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true})});

{t:"寒食",a:"韩翃",l:["春城无处不飞花，","寒食东风御柳斜。","日暮汉宫传蜡烛，","轻烟散入五侯家。"],e:['🌸','🌿','🕯️','🏛️']},
{t:"逢雪宿芙蓉山主人",a:"刘长卿",l:["日暮苍山远，","天寒白屋贫。","柴门闻犬吠，","风雪夜归人。"],e:['🌇','🏔️','🐕','❄️']},
{t:"送灵澈上人",a:"刘长卿",l:["苍苍竹林寺，","杳杳钟声晚。","荷笠带斜阳，","青山独归远。"],e:['🎋','🔔','🌇','⛰️']},
{t:"秋夜寄邱员外",a:"韦应物",l:["怀君属秋夜，","散步咏凉天。","空山松子落，","幽人应未眠。"],e:['🍂','🌙','🌲','💭']},

{t:"江畔独步寻花",a:"杜甫",l:["黄四娘家花满蹊，","千朵万朵压枝低。","留连戏蝶时时舞，","自在娇莺恰恰啼。"],e:['🌸','🌺','🦋','🐦']},
{t:"绝句其二",a:"杜甫",l:["迟日江山丽，","春风花草香。","泥融飞燕子，","沙暖睡鸳鸯。"],e:['☀️','🌸','🐦','🦆']},

{t:"宿新市徐公店",a:"杨万里",l:["篱落疏疏一径深，","树头新绿未成阴。","儿童急走追黄蝶，","飞入菜花无处寻。"],e:['🌿','🌳','🧒','🦋']},

 ['校车来接我','清晨，校车停在家门口。','司机叔叔笑着打招呼。','小朋友们排队上车。','校车稳稳地开向学校。'],
 ['轮子和翅膀','小汽车羡慕飞机有翅膀。','飞机说：你的轮子也很好呀。','小汽车想了想，笑了。','它们各有各的本领。'],
 ['修路的卡车','卡车拉来一车石子。','工人叔叔把路铺平。','卡车说：我的任务完成啦。','路修好了，大家都感谢它。'],
 ['地铁里的故事','地铁里，妈妈给小朋友讲故事。','车厢轻轻晃。','故事讲到一半，到站了。','小朋友说：明天再讲。'],
 ['自行车的铃','小朋友骑车去上学。','路上遇见同学。','他按响车铃，打个招呼。','两人一起骑到校门口。'],
 ['消防演练','今天是消防演练。','消防车开到学校。','叔叔教大家怎么逃生。','大家都学会了保护自己。'],
 ['小船和大海','小船第一次看见大海。','大海蓝蓝的，无边无际。','它有点害怕。','船长说：别怕，我陪着你。'],
 ['机场的告别','机场里，有人在告别。','妈妈蹲下来抱了抱孩子。','孩子说：我会想你的。','飞机起飞了，云很白。'],
 ['交通标志','路边有很多交通标志。','红色的是停，绿色的是行。','小朋友一个一个认。','他说：我以后要遵守规则。'],
 ['最后一班车','夜很深了。','最后一班公交车开出。','车上只有一位乘客。','司机说：我会送你到家。'],
 ['新车','车行里来了一辆新车。','它闪闪发亮。','老车说：欢迎你。','新车说：请多指教。'],
 ['过桥','公交车要过一座桥。','桥很窄。','司机慢慢开。','大家安全到了对岸。'],
 ['路边的花','路边开了一片花。','司机轻轻按了一下喇叭。','喇叭声很轻，怕吵到花。','花在风里摇。'],
 ['小船的心愿','小船有一个心愿。','它想去很远的海。','船长说：等风平浪静，我们就出发。','小船开心地晃了晃。'],
 ['回家','天黑了，车灯亮起来。','公交车往家开。','小朋友在座位上打瞌睡。','到站了，妈妈来接他。'],
],
construction:[
 ['工地真热闹','工地上，大吊车伸长了手臂。','翻斗车拉来好多沙子。','压路机把路面压得平平的。','大家一起，盖起一座新房子。'],
 ['搭建新桥','河两岸的小朋友想要一座桥。','工程师先量长度、画好图纸。','吊车把材料慢慢放到位置。','桥梁检查合格后，大家安全通过。'],
 ['安全帽','工地上每个人都戴好安全帽。','司机先检查机器和周围环境。','工人用手势互相提醒。','工作完成，大家平安回家。'],
 ['修好小路','雨后小路出现了几个坑。','压路机先把地面整理平整。','卡车送来碎石和新材料。','小路修好，行人走得更方便。'],
 ['任务牌上的字','工程车来到工地，任务牌上写着字。','大家先认字，再开始工作。','认对了，吊车才启动。','材料被准确地送到指定位置。'],
 ['救援大吊车','大树旁一辆小车陷进泥里。','救援队先确认现场安全。','吊车慢慢拉起小车。','大家感谢救援队，也记住不走危险路。'],
 ['大吊车的力气','大吊车今天要吊起一块大石头。','它慢慢升起手臂。','石头稳稳地落在车上。','大家鼓掌：真厉害。'],
 ['修路灯','工地旁边有一盏路灯坏了。','工人叔叔架上梯子。','小朋友在下面递工具。','灯亮了，整条路都亮堂堂。'],
 ['雨后的坑','雨停了，路上有几个坑。','压路机慢慢开过来。','它把坑填平，又压一压。','路平了，大家走着更安心。'],
 ['小小工程师','小朋友戴上安全帽。','他跟着叔叔看图纸。','还学着量一量长度。','叔叔说：你以后一定是好工程师。'],
 ['安静的夜晚','工地安静下来。','工具被收进工具箱。','灯一盏一盏关掉。','明天，这里还要继续盖房子。'],
 ['一起搬砖头','叔叔们要搬砖头。','小朋友帮忙递小的。','一块一块，堆得整整齐齐。','叔叔说：人多力量大。'],
 ['挖土机和小蚂蚁','挖土机在工地上挖土。','它看见一窝小蚂蚁。','就轻轻绕开，不碰它们。','小蚂蚁排着队，安全搬走了。'],
 ['戴安全帽的小熊','小熊来工地参观。','叔叔给它一顶小安全帽。','它戴上去，认真又神气。','叔叔说：安全第一。'],
 ['塔吊的视野','塔吊高高地立着。','它看见整片工地。','也看见远处的小河。','它说：站得高，看得远。'],
 ['一块砖的旅行','一块砖从卡车上下来。','工人把它搬到墙边。','它和伙伴们排成一面墙。','新房子一天天长高。'],
 ['工地的早晨','天刚亮，工地就热闹起来。','机器发动，工人集合。','大家检查安全，才开始干活。','新的一天，从这里开始。'],
 ['收工的时候','太阳落山，工地安静了。','工人把工具收好。','互相说：明天见。','工地静静等着明天。'],
 ['大吊车的朋友','大吊车有一个朋友，是卡车。','卡车拉材料，吊车搬材料。','它们配合得很好。','工程师说：你们是最佳搭档。'],
 ['测量','工人叔叔拿出尺子。','他仔细量了墙的长度。','记录下来，再开始砌墙。','他说：量准了，才盖得稳。'],
 ['工具箱','工地上有一个大工具箱。','里面有锤子、扳手、钉子。','叔叔每次用完都放回去。','他说：工具归位，下次好找。'],
 ['安全的黄色','工地上到处是黄色。','安全帽是黄的，机器也是黄的。','黄色很显眼。','叔叔说：黄色提醒大家注意安全。'],
 ['一块木板','工地上有一块木板。','工人把它做成小凳子。','小朋友坐着休息。','木板说：我也有用处。'],
 ['建好的房子','房子建好了。','工人们站在门口看。','窗户亮堂堂的。','大家说：这是我们的作品。'],
 ['最后一车土','今天工程车要拉最后一车土。','它慢慢开。','土倒在指定的地方。','它说：任务完成。'],
 ['新来的工人','工地来了一位新工人。','他有点紧张。','老工人教他戴好安全帽。','他们成了好朋友。'],
 ['雨后的工地','雨停了，工地湿湿的。','工人先检查地面。','确认安全，才开始干活。','大家都很小心。'],
 ['高处的风景','塔吊升到很高。','工人看见整座城市。','他说：站在这里，什么都看得清。','他笑了。'],
 ['修好的路','路修好了。','小朋友在路边跑。','老人慢慢走过。','工人说：这就是我们修路的理由。'],
 ['收工','太阳落山了。','工人收好工具。','彼此说：明天见。','工地安静下来。'],
],
space:[
 ['飞向月亮','火箭轰隆隆，飞向太空。','小宇航员看见蓝色的地球。','他在月亮上轻轻跳呀跳。','他摘下一颗星星，带回给妈妈。'],
 ['月球探险','小宇航员乘火箭飞向月球。','他检查氧气、地图和通信设备。','他发现一块特别的月球石头并拍照。','样本安全带回飞船，探险圆满结束。'],
 ['修理卫星','地面控制中心发现卫星信号变弱。','宇航员按清单检查太阳能板。','他轻轻固定松动的部件。','信号恢复，地球上的朋友欢呼。'],
 ['外星朋友','一艘小飞船停在太空站外。','宇航员用灯光发出友好的问候。','外星朋友送来一颗发光的石头。','他们约定互相帮助、和平探索。'],
 ['控制屏上的字','小宇航员进入太空站。','控制屏上出现一排字。','他一个一个读给地面听。','读对了，飞船才继续前进。'],
 ['迷路的小星星','一颗小星星找不到星星队伍。','宇航员打开星图寻找方向。','月亮给出明亮的指引。','小星星回到队伍，夜空再次闪亮。'],
 ['太空里的早晨','宇航员在太空站醒来。','他飘到窗边，看地球。','地球蓝蓝的，真好看。','他轻轻说：早安，地球。'],
 ['会飞的铅笔','宇航员在太空写字。','铅笔一松手就飘起来。','他笑着把笔抓回来。','原来太空里，什么都会飞。'],
 ['星星的名字','小宇航员给星星起名字。','他叫最亮的那颗“家”。','每次看见它，就想起妈妈。','妈妈说：我们也在看同一颗星。'],
 ['回到地球','任务完成，飞船要回家了。','宇航员检查好舱门。','飞船穿过大气层，稳稳落地。','家人跑过来，抱住他。'],
 ['外星人的信','外星朋友送来一封信。','信上画着星星和笑脸。','宇航员也画了一封信回它。','它们约好下次再一起看星星。'],
 ['月亮上的脚印','宇航员在月亮上走。','他留下了一串脚印。','他回头看看地球，笑了。','这一小步，真让人难忘。'],
 ['太空里的水','宇航员喝水要小心。','水会变成小球飘起来。','他用吸管轻轻吸一口。','笑着说：太空的水真有趣。'],
 ['种在太空的豆','宇航员在太空种豆子。','每天记录它的变化。','小豆芽慢慢长出来。','他轻轻说：你也在旅行呢。'],
 ['星星的晚安','夜里，宇航员准备睡觉。','他把睡袋固定在舱壁上。','透过窗看星星。','他轻轻说：晚安，星星。'],
 ['返回舱','返回舱要回家了。','宇航员检查好设备。','飞船穿过大气层。','降落伞打开，稳稳落地。'],
 ['太空里的音乐','宇航员带了一把小口琴。','他吹起熟悉的曲子。','地面的人听见了，笑了。','音乐让太空不再孤单。'],
 ['看见日出','太空站一天能看见很多次日出。','宇航员每次都停下看一会儿。','太阳从地球边缘升起。','他说：每一次都很美。'],
 ['飞船起飞','飞船要起飞了。','宇航员系好安全带。','倒数：三、二、一。','飞船冲向天空。'],
 ['太空里的星星','太空里的星星特别亮。','宇航员看了很久。','他想起小时候也这样看星星。','他轻轻笑了。'],
 ['月球车','月球车在月球上慢慢开。','它采集石头和土壤。','宇航员遥控它。','月球车说：我在为你工作。'],
 ['回家的路','飞船要回地球了。','宇航员检查好所有设备。','他看着地球越来越大。','他说：家，我回来了。'],
 ['太空的窗外','宇航员打开窗。','外面是黑黑的太空。','地球像一颗蓝宝石。','他看了很久，没说话。'],
 ['早上的第一句话','宇航员醒来第一句话。','他说：早安，地球。','地面的人听见了，笑了。','新的一天开始了。'],
 ['最后一颗星星','宇航员看见最后一颗星星隐去。','太阳从地球边升起。','他说：新的一天来了。','他轻轻笑了。'],
 ['太空的梦','宇航员在太空站睡着了。','他梦见自己在地球上跑。','醒来时，窗外是星星。','他说：两个家，都很好。'],
 ['地球的颜色','从太空看地球。','是蓝蓝的一颗球。','宇航员说：我们的家。','他轻轻摸了摸窗。'],
 ['回家','飞船穿过云层。','降落伞打开。','稳稳落地。','宇航员走出来，笑了。'],
 ['星空下的约定','宇航员和外星朋友告别。','它们说：下次再见。','飞船飞远了。','星星一闪一闪。'],
 ['第一句话','宇航员回到地球。','他说的第一句话。','是：妈妈，我回来了。','妈妈抱住了他。'],
],
dino:[
 ['恐龙宝宝','长脖子恐龙在树林里吃树叶。','草丛里有一颗大大的恐龙蛋。','咔嚓一声，小恐龙出来啦。','恐龙妈妈把它抱在怀里。'],
 ['爱笑的霸王龙','霸王龙吼吼吼，可是它很爱笑。','火山轰隆隆，小恐龙们赶紧躲好。','大家手拉手，一起走进森林。','夜晚，恐龙们都睡着了。'],
 ['恐龙找水','炎热的日子里，小恐龙口渴了。','它跟着脚印寻找河流。','路上它帮小甲龙搬开树枝。','大家找到清水，也学会轮流饮水。'],
 ['恐龙蛋回家','一颗恐龙蛋从巢边滚了出来。','小恐龙们围在旁边想办法。','它们用柔软的叶子垫住蛋。','蛋被安全送回巢里，妈妈很安心。'],
 ['石牌上的字','小恐龙在树林里发现一块石牌。','石牌上刻着几个字。','它请恐龙老师来读。','读完后，它们按字上的方向找到了果子。'],
 ['森林小医生','小三角龙的脚被树枝划伤了。','朋友找来干净的叶子和大恐龙。','大家请来懂草药的慈爱长颈龙。','伤口得到照顾，小三角龙好好休息。'],
 ['小恐龙的第一次吼','小恐龙想学会吼叫。','它深吸一口气，吼了一声。','声音小小的，像小猫。','妈妈笑着说：慢慢来。'],
 ['树叶伞','下雨了，小恐龙没有伞。','它找来一片大树叶。','顶在头上，雨滴答滴答。','小甲龙也躲进来，一起回家。'],
 ['恐龙蛋的秘密','一颗蛋在草丛里轻轻晃动。','小恐龙们围过来看。','咔嚓，蛋壳裂开了。','一只小恐龙探出头来。'],
 ['火山脚下的花','火山脚下开了一朵小花。','小恐龙每天来看它。','它给花浇水，还唱歌。','花开了，小恐龙笑了。'],
 ['找妈妈','小恐龙走丢了。','它跟着脚印找妈妈。','路上遇到长脖子龙。','长脖子龙带它找到了家。'],
 ['星空下的恐龙','夜里，恐龙们躺在草地上。','它们看天上的星星。','小恐龙问：星星会睡觉吗？','妈妈轻轻说：它们陪着你呢。'],
 ['小恐龙的雨靴','下雨了，小恐龙没有雨靴。','它用两片大叶子包住脚。','走着走着，叶子掉了。','妈妈笑着说：这样也很好玩。'],
 ['长脖子龙的围巾','天气变冷了。','长脖子龙把围巾绕了好几圈。','小恐龙问：借我一点好吗？','长脖子龙笑着分给它一半。'],
 ['会唱歌的石头','小恐龙捡到一块石头。','石头轻轻一碰就会响。','它敲一敲，叮叮咚咚。','大家一起听，像在开音乐会。'],
 ['恐龙蛋的摇篮','恐龙妈妈把蛋放在软草上。','轻轻摇着，哼着歌。','小恐龙们在旁边安静地看。','蛋里传出轻轻的声音。'],
 ['月亮上的恐龙','小恐龙梦见自己飞到月亮。','月亮上有一只大恐龙。','它们一起看地球。','醒来时，它还笑着。'],
 ['小恐龙的家','小恐龙的家在大树旁。','有软软的草，有清清的水。','朋友们常来做客。','它说：家，就是有朋友的地方。'],
 ['小恐龙的画','小恐龙用树枝在沙地上画画。','它画了一片森林。','还画了妈妈和自己。','妈妈看见了，轻轻笑了。'],
 ['火山灰','火山喷了一点灰。','小恐龙们有点害怕。','长脖子龙说：别怕，我们躲好。','灰散了，大家又出来了。'],
 ['恐龙运动会','恐龙们要开运动会。','小恐龙参加跑步比赛。','它跑得慢，但坚持到底。','大家都为它鼓掌。'],
 ['一片叶子','小恐龙捡到一片大叶子。','它把叶子当成小船。','放在水里，轻轻漂。','小甲虫坐上去，笑得很开心。'],
 ['影子游戏','太阳出来了。','小恐龙看见自己的影子。','它跳，影子也跳。','它笑着说：你也在学我呀。'],
 ['夜晚的森林','夜里，森林安静极了。','小恐龙听见虫鸣。','它轻轻闭上眼。','梦里，它还在奔跑。'],
 ['小恐龙的脚印','小恐龙在泥地上走。','留下一串小脚印。','妈妈沿着脚印找它。','找到时，它正在笑。'],
 ['火山安静了','火山今天很安静。','小恐龙们放心出来玩。','它们在山脚下追逐。','太阳暖暖的。'],
 ['大树下的家','小恐龙的家在大树下。','树叶沙沙响。','妈妈在门口等它。','它跑过去，抱住妈妈。'],
 ['星星出来了','天黑了，星星出来了。','小恐龙躺在草地上。','一颗星星划过。','它轻轻许了一个愿。'],
 ['最后一颗蛋','巢里只剩最后一颗蛋。','小恐龙们围着它。','咔嚓，蛋裂开了。','一只小恐龙探出头。'],
 ['长大','小恐龙慢慢长大了。','它学会了自己找食物。','也学会照顾弟弟妹妹。','妈妈看着它，笑了。'],
],
animals:[

function storyFor(themeId,level){
  const arr=STORY_BOOK[themeId]||STORY_BOOK.animals;
  const idx=Math.min(Math.floor(level/3),arr.length-1);
  return {idx,b:arr[idx]};
}
function storyScenes(b,themeEmoji){
  return [[themeEmoji,b[1]],[themeEmoji,b[2]],[themeEmoji,b[3]],[themeEmoji,b[4]]];
}

function escapeStoryText(text){return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* 只高亮本故事对应三关的字；storyLevel 缺省则全部普通显示 */
function storyTextHTML(text,storyLevel){
  const cur=new Set();
  if(storyLevel!=null){
    for(let k=0;k<3;k++){
      const arr=LV[storyLevel+k];
      if(arr)arr.forEach(c=>cur.add(c));
    }
  }
  return Array.from(String(text)).map(ch=>{
    const safe=escapeStoryText(ch);
    if(cur.has(ch))return `<span class="story-new">${safe}</span>`;
    return safe;
  }).join('');
}

function theater(o){
  let timers=[],runId=0;
  const ov=h('div','ov'),bx=h('div','card poem'),st=h('div','stage');
  const stop=()=>{runId++;timers.forEach(clearTimeout);timers=[];silence()};
  const close=()=>{stop();ov.remove()};
  const wait=(ms,fn)=>{const id=setTimeout(fn,ms);timers.push(id)};
  function play(){
    stop();const myRun=runId;st.innerHTML='';
    const valid=()=>myRun===runId&&ov.isConnected;
    const showScene=(sc)=>{
      if(!valid())return;
      const line=o.highlight?storyTextHTML(sc[1],o.storyLevel):escapeStoryText(sc[1]);
      st.innerHTML=`<div class="sc">${sc[0]}</div><div class="han ln story-line">${line}</div>`;
      speakText(sc[1],o.rate,()=>{if(valid())wait(350,()=>nextScene())});
    };
    let index=0;
    const nextScene=()=>{
      if(!valid())return;
      if(index>=o.scenes.length){st.innerHTML='<div class="sc">👏</div><div class="han ln">真棒！</div>';return}
      showScene(o.scenes[index++]);
    };
    st.innerHTML=`<div class="sc">${o.icon}</div><div class="han ln">《${o.title}》</div><div class="word">${o.sub||''}</div>`;
    speakText(o.title+(o.sub?'，'+o.sub:''),o.rate,()=>{if(valid())nextScene()});
  }
  const row=h('div','row');
  const again=h('button','btn','🔁 再看一遍');again.style.background='var(--sky)';again.onclick=play;
  const ok=h('button','btn',o.nextLabel);ok.style.background='var(--coral)';ok.onclick=()=>{close();o.next&&o.next()};
  row.append(again,ok);
  bx.append(h('div','q',o.head),st,row);ov.append(bx);document.body.append(ov);beep(true);play();
}

    it={e:p[0],n:p[1],r:Math.floor(Math.random()*13)-6};
  }
  list.push(it);save();beep(true);
  const ov=h('div','ov'),bx=h('div','card poem');
  const ok=h('button','btn','放进收藏柜 '+T.i);ok.style.background='var(--coral)';ok.onclick=()=>{ov.remove();museum()};
  bx.append(h('div','q','🎉 得到新贴纸啦！'),h('div','tbig',artOf(it)),h('div','q',it.n),ok);
  ov.append(bx);document.body.append(ov);setTimeout(()=>speakText(it.n),500);
}
function museum(){
  const T=curTheme(),list=S.coll[T.id]||[];
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 首页');bk.onclick=home;bar.append(bk,h('span','q',`${T.i} 我的${T.coll}`));app.append(bar);
  app.append(h('p','q',`已收集 ${list.length} 个 · 再得 ${24-S.stars%24} 颗星，就有新贴纸`));
  const cab=h('div','cab'),slots=Math.max(6,Math.ceil((list.length+1)/3)*3);
  for(let i=0;i<slots;i++){const it=list[i];cab.append(it?h('div','shelf',artOf(it)+`<span>${it.n}</span>`):h('div','shelf empty','❔'))}
  app.append(cab);giveSticker();
}

applyTheme();$('#thm').onclick=()=>pickTheme(false);home();conv(document.body);if(!S.themeChosen)pickTheme(true);mo.observe(document.body,{childList:true,subtree:true,characterData:true});
</script>
