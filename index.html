<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小小识字乐园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F2;--ink:#3D3260;--soft:#8A7FA8;--coral:#FFB3C6;--leaf:#A8E6CF;--sky:#A9D4FF;--plum:#CDB4F6;--sun:#FFE29A;--card:#fff;--line:#F3E4EA;--shadow:0 10px 28px rgba(190,140,170,.2);--glow1:#FFE1EA;--glow2:#D9F4E8}
@media(prefers-color-scheme:dark){:root{--bg:#171630;--ink:#F3F0FF;--soft:#A9A6D3;--card:#25234A;--line:#4A4580;--shadow:0 10px 30px rgba(0,0,0,.35);--glow1:#3A2A5E;--glow2:#24454A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(60% 40% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 40% at 100% 10%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.han{font-family:"Kaiti SC",KaiTi,STKaiti,"楷体",serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:980px;margin:0 auto}
h1{font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:1px}
.stars{background:var(--card);border-radius:99px;padding:8px 18px;font-size:20px;box-shadow:var(--shadow)}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{filter:brightness(1.04)}button:active{transform:scale(.96)}
:focus-visible{outline:4px solid #8E6CF0;outline-offset:3px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:8px}
.big{position:relative;overflow:hidden;border-radius:32px;padding:34px 20px;font-size:32px;color:#3D3260;box-shadow:0 14px 28px rgba(190,140,170,.3);text-align:center}
.big::before,.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.big small{display:block;font-size:17px;margin-top:8px;opacity:.92}
.big .e{font-size:68px;display:block;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.back{background:var(--card);border-radius:99px;padding:9px 20px;font-size:20px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.tab{background:var(--card);border-radius:99px;padding:8px 16px;font-size:18px;white-space:nowrap;box-shadow:var(--shadow);color:var(--soft)}
.tab[aria-pressed=true]{background:var(--plum);color:#3D3260}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.cell{background:var(--card);border-radius:24px;aspect-ratio:1;font-size:46px;position:relative;box-shadow:var(--shadow);color:var(--ink)}
.cell:hover{transform:translateY(-3px)}
.cell.done{background:linear-gradient(160deg,rgba(31,191,152,.18),var(--card))}
.cell.done::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#1B5E4A;font:700 13px/20px sans-serif}
.cell i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:18px}
.card{background:var(--card);border-radius:36px;padding:22px 18px;display:grid;gap:16px;justify-items:center;box-shadow:var(--shadow)}
.media{display:flex;gap:14px;flex-wrap:nowrap;justify-content:center;align-items:center;width:100%}
.pic{width:min(240px,42vw);height:min(240px,42vw);flex:none;border-radius:28px;background:linear-gradient(160deg,#E4F1FF,#FDE9F1);display:grid;place-items:center;overflow:hidden;font-size:min(20vw,110px)}
.pic img,.pic video{width:100%;height:100%;object-fit:contain}
.bigchar{font-size:min(36vw,190px);flex:none;line-height:1;background:linear-gradient(160deg,#FF8FAE,#9A7BF0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.word{font-size:26px;color:var(--soft)}
#writer{width:220px;height:220px;border-radius:18px;border:3px solid #F4A3B8;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 0V100M0 50H100M0 0L100 100M100 0L0 100' stroke='%23F4A3B8' stroke-width='1' stroke-dasharray='4 3' fill='none'/></svg>") center/100% 100% no-repeat}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{position:relative;overflow:hidden;border-radius:99px;padding:13px 26px;font-size:24px;color:#3D3260;box-shadow:0 8px 18px rgba(190,140,170,.3)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;width:100%}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:28px;font-size:68px;padding:14px 0;box-shadow:var(--shadow)}
.opt:hover{border-color:#B79CF5}
.opt.ok{background:#D5F6E8;border-color:#7ED7B6;color:#0B5A44;animation:pop .4s}.opt.no{background:#FFE1E7;border-color:#FF9FB5;color:#7A1F2B;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{height:12px;border-radius:99px;background:var(--line);width:100%;overflow:hidden;margin-bottom:14px}.prog b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A8E6CF,#A9D4FF);transition:width .3s}
.q{font-size:28px;text-align:center;color:var(--ink)}
.result .e{font-size:100px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
img.em{height:1em;width:1em;vertical-align:-.14em;display:inline-block;pointer-events:none}
.pic img.em{width:1em;height:1em;object-fit:initial}
.ov{position:fixed;inset:0;background:rgba(61,50,96,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.poem{max-width:560px;width:100%}
.stage{min-height:240px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;width:100%;background:linear-gradient(160deg,#E4F1FF,#FDE9F1);border-radius:28px;padding:16px;color:#3D3260}
.sc{font-size:110px;line-height:1.1;animation:pop .6s}
.ln{font-size:min(9vw,44px)}
</style>
</head>
<body>
<header><h1>🐣 小小识字乐园</h1><div class="stars" id="stars">⭐ 0</div></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script>
/* ===== 数据 ===== */
const RAW="一二三四五六七八九十上下左右大小多少土个入人儿火文木禾无口日月天中了子门不开目耳头米见白田电也长山出飞马鸟云公车牛羊巾牙尺毛卜又心风力手水广升足走方半巴业本平书自已东西回片皮生里果几用鱼今正雨两瓜衣来年万百丁齐冬说友话春朋高你绿们花红草爷亲节的岁行古处声知忙洗真认父扫母爸写全完关家看笑着兴画会妈合奶放午收女气太早去亮和李语秀千香听远唱定连向以更后意主总先起干明赶净同专工才级队蚂蚁前房空网诗黄林闭童立是我朵叶美机她过他时送让吗往吧得虫很河借姐呢呀哪谁凉怕量跟最园脸因阳为光可法石找办许别那到都吓叫再做象点像照沙海桥军竹苗井面乡忘想念王这从进边道贝男原爱虾跑吹乐地老快师短淡对热冷情拉活把种给吃练学习非苦常问伴间共伙汽分要没孩位选北湖南秋江只帮星请雪就球跳玩桃树刚兰座各带坐急名发成动晚新有么在变什条";
const CHARS=[...new Set(RAW)];
/* 有图的字: 字:[图片emoji, 词语]。想用自己的图/视频: 放进 assets/img/字.png 和 assets/video/字.mp4 即可 */
const P={一:['🌙','一个月亮'],二:['👀','两只眼睛'],三:['🐷','三只小猪'],四:['🍀','四叶草'],五:['🖐️','五个手指'],六:['🎲','六点'],七:['🌈','七色彩虹'],八:['🐙','八条腿'],九:['🕘','九点钟'],十:['🙌','十个手指'],
上:['⬆️','上面'],下:['⬇️','下面'],左:['⬅️','左边'],右:['➡️','右边'],大:['🐘','大象'],小:['🐜','小蚂蚁'],土:['🪴','泥土'],人:['🧑','大人'],儿:['👶','儿童'],火:['🔥','火焰'],木:['🪵','木头'],禾:['🌾','禾苗'],口:['👄','嘴巴'],日:['☀️','太阳'],月:['🌙','月亮'],天:['🌤️','天空'],子:['👦','孩子'],门:['🚪','大门'],开:['🔓','打开'],目:['👁️','眼睛'],耳:['👂','耳朵'],头:['🙂','头'],米:['🍚','大米'],田:['🌾','稻田'],电:['⚡','闪电'],山:['⛰️','高山'],飞:['✈️','飞机'],马:['🐴','小马'],鸟:['🐦','小鸟'],云:['☁️','白云'],车:['🚗','汽车'],牛:['🐮','奶牛'],羊:['🐑','绵羊'],牙:['🦷','牙齿'],毛:['🧶','毛线'],心:['❤️','爱心'],风:['🌬️','大风'],手:['✋','小手'],水:['💧','水滴'],足:['🦶','脚'],书:['📖','图书'],鱼:['🐟','小鱼'],雨:['🌧️','下雨'],瓜:['🍉','西瓜'],衣:['👕','衣服'],冬:['⛄','冬天'],春:['🌷','春天'],花:['🌸','花朵'],红:['🍓','红色'],绿:['🥬','绿色'],黄:['🍋','黄色'],白:['🥛','白色'],草:['🌱','小草'],家:['🏠','我的家'],看:['👀','看一看'],笑:['😄','笑一笑'],画:['🖼️','画画'],果:['🍎','水果'],听:['🎧','听一听'],唱:['🎤','唱歌'],写:['✍️','写字'],洗:['🧼','洗手'],爸:['👨','爸爸'],妈:['👩','妈妈'],奶:['👵','奶奶'],爷:['👴','爷爷'],女:['👧','女孩'],男:['👦','男孩'],蚂:['🐜','蚂蚁'],蚁:['🐜','蚂蚁'],房:['🏡','房子'],网:['🕸️','蜘蛛网'],林:['🌳','树林'],叶:['🍃','树叶'],树:['🌲','大树'],朵:['🌼','花朵'],虫:['🐛','毛毛虫'],河:['🏞️','小河'],脸:['🙂','小脸'],光:['💡','灯光'],石:['🪨','石头'],海:['🌊','大海'],桥:['🌉','大桥'],竹:['🎋','竹子'],井:['⛲','水井'],王:['👑','国王'],爱:['💕','爱你'],虾:['🦐','小虾'],跑:['🏃','跑步'],吹:['🎈','吹气球'],吃:['🍽️','吃饭'],球:['⚽','足球'],桃:['🍑','桃子'],星:['⭐','星星'],雪:['❄️','下雪'],湖:['🦆','湖水'],汽:['🚌','汽车'],玩:['🧸','玩具'],跳:['🤸','跳高'],笔:['🖊️','笔'],南:['🧭','南方'],北:['🧭','北方'],东:['🌅','东方'],西:['🌇','西方'],秋:['🍂','秋天'],热:['🥵','很热'],冷:['🥶','很冷'],快:['🐇','快跑'],老:['🧓','老人'],亮:['🌟','明亮'],明:['💡','明亮'],脸:['🙂','小脸'],美:['🌺','美丽'],园:['🏞️','公园'],座:['💺','座位'],帽:['🧢','帽子']};
const LV=[];for(let i=0;i<CHARS.length;i+=12)LV.push(CHARS.slice(i,i+12));
const PIC=CHARS.filter(c=>P[c]);

/* ===== 状态 ===== */
const $=s=>document.querySelector(s),app=$('#app');
let S={done:{},stars:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem('hanzi')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hanzi',JSON.stringify(S))}catch(e){}$('#stars').textContent='⭐ '+S.stars};
save();
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};

/* ===== 声音 ===== */
let CUR;
/* 有真人录音的字，写在这里，例如: new Set(['鱼','日','月']) ，录音放 assets/audio/字.mp3 */
const RECORDED=new Set([]);
function say(c){
  try{speechSynthesis.cancel()}catch(e){}
  try{CUR&&CUR.pause()}catch(e){}
  if(!RECORDED.has(c)){tts(c);return}
  const a=new Audio(`assets/audio/${c}.mp3`);CUR=a;
  a.onerror=()=>tts(c);
  a.play().catch(()=>tts(c));
}
function tts(c){
  try{
    speakText(P[c]?`${c}。${P[c][1]}`:c);
  }catch(e){}
}
function speakText(w){
  try{
    const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';
    const vs=speechSynthesis.getVoices().filter(v=>/zh|cmn/i.test(v.lang));
    const v=vs.find(v=>/Tingting|Meijia|Xiaoxiao|Xiaoyi|Huihui|Yaoyao|female|女/i.test(v.name))||vs[0];
    if(v)u.voice=v;
    u.pitch=1.15;u.rate=.6; /* 接近自然人声；想更童声可把 pitch 调到 1.3 */
    speechSynthesis.speak(u);
  }catch(e){}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=ok?[660,880,1100]:[220];n.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.15)})}catch(e){}}

/* ===== 图片/视频: 先找 assets 里的文件，没有就用 emoji ===== */
function media(c){
  const box=h('div','pic');
  const emo=()=>{box.innerHTML=P[c]?P[c][0]:`<span class="han" style="font-size:min(20vw,110px)">${c}</span>`;if(P[c]&&P[c][0].length>2)box.style.fontSize='min(8vw,44px)'};
  const img=new Image();img.alt=c;img.onload=()=>{box.innerHTML='';box.append(img)};img.onerror=emo;img.src=`assets/img/${c}.png`;emo();
  const v=document.createElement('video');v.src=`assets/video/${c}.mp4`;v.muted=false;v.controls=true;v.playsInline=true;
  v.onloadeddata=()=>{box.innerHTML='';box.append(v)};
  return box;
}

/* ===== 首页 ===== */
function home(){
  app.innerHTML='';
  const g=h('div','home');
  const a=h('button','big','<span class="e">📚</span>学习<small>看一看 · 听一听 · 写一写</small>');a.style.background='linear-gradient(135deg,#A9D4FF,#CDB4F6)';a.onclick=()=>learn(0);
  const b=h('button','big','<span class="e">🎯</span>测试<small>听声音 · 看图片 · 找汉字</small>');b.style.background='linear-gradient(135deg,#FFC4D4,#FFD9A8)';b.onclick=testMenu;
  g.append(a,b);app.append(g);
  const n=Object.keys(S.done).length;
  app.append(h('p','q',`已经认识 <b>${n}</b> / ${CHARS.length} 个字`));
}

/* ===== 学习 ===== */
function learn(lv){
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 首页');bk.onclick=home;
  const tabs=h('div','tabs');LV.forEach((_,i)=>{const t=h('button','tab',`第${i+1}关`);t.setAttribute('aria-pressed',i===lv);t.onclick=()=>learn(i);tabs.append(t)});
  bar.append(bk,tabs);app.append(bar);
  const gr=h('div','grid');
  LV[lv].forEach((c,i)=>{const b=h('button','cell han'+(S.done[c]?' done':''),c+(P[c]?`<i>${P[c][0]}</i>`:''));b.onclick=()=>showCard(lv,i);gr.append(b)});
  app.append(gr);
}
let writer;
function showCard(lv,i){
  const list=LV[lv],c=list[i];const isNew=!S.done[c];S.done[c]=1;save();say(c);
  if(isNew){const n=Object.keys(S.done).length;if(n%10===0)setTimeout(()=>poem(n/10-1),2200)}
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 返回');bk.onclick=()=>learn(lv);bar.append(bk,h('span','q',`${i+1} / ${list.length}`));app.append(bar);
  const card=h('div','card');
  const m=h('div','media');m.append(media(c));
  const big=h('div','bigchar han',c);m.append(big);card.append(m);
  if(P[c])card.append(h('div','word',P[c][1]));
  const w=h('div','');w.id='writer';card.append(w);
  const r=h('div','row');
  const mk=(t,col,f)=>{const b=h('button','btn',t);b.style.background=col;b.onclick=f;r.append(b)};
  mk('🔊 听','var(--sky)',()=>say(c));
  mk('✍️ 写','var(--plum)',()=>anim());
  if(i>0)mk('⬅️','var(--leaf)',()=>card_(lv,i-1));
  mk(i<list.length-1?'下一个 ➡️':'🎉 完成','var(--coral)',()=>i<list.length-1?card_(lv,i+1):(beep(true),learn(lv)));
  card.append(r);app.append(card);
  function anim(){try{writer.animateCharacter()}catch(e){}}
  try{writer=HanziWriter.create('writer',c,{width:220,height:220,padding:16,strokeColor:'#FF7FA0',radicalColor:'#7FB6F5',strokeAnimationSpeed:.5,delayBetweenStrokes:600,showOutline:true,outlineColor:'#EBDDE3',onLoadCharDataError:()=>{w.style.display='none'}});anim()}catch(e){w.style.display='none'}
  function card_(a,b){showCard(a,b)}
}

/* ===== 测试 ===== */
function testMenu(){
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 首页');bk.onclick=home;bar.append(bk);app.append(bar);
  const g=h('div','home');
  const mk=(e,t,s,col,f)=>{const b=h('button','big',`<span class="e">${e}</span>${t}<small>${s}</small>`);b.style.background=col;b.onclick=f;g.append(b)};
  mk('🖼️','看图找字','小图片，找汉字','var(--leaf)',()=>quiz('pic'));
  mk('👂','听音找字','听声音，找汉字','var(--plum)',()=>quiz('ear'));
  app.append(g,h('p','q',`从学过的 ${CHARS.filter(c=>S.done[c]).length} 个字里随机抽，最多 15 题`));
}
function quiz(mode){
  const learned=CHARS.filter(c=>S.done[c]);
  const pool=mode==='pic'?learned.filter(c=>P[c]):learned;
  const base=mode==='pic'?PIC:CHARS;
  if(!pool.length){
    app.innerHTML='';
    const m=h('div','card result',`<div class="e">📚</div><div class="q">${mode==='pic'?'学过的字里还没有带图的字':'还没有学过的字'}，先去学习吧！</div>`);
    const b=h('button','btn','去学习');b.style.background='var(--sky)';b.onclick=()=>learn(0);m.append(b);app.append(m);return;
  }
  const qs=shuffle(pool).slice(0,15);let n=0,right=0;
  function next(){
    app.innerHTML='';
    if(n>=qs.length)return end();
    const c=qs[n];
    const others=[...new Set([...shuffle(pool.filter(x=>x!==c)),...shuffle(base.filter(x=>x!==c))])].slice(0,2);
    const opts=shuffle([c,...others]);
    const bar=h('div','bar');const bk=h('button','back','← 退出');bk.onclick=testMenu;
    const pr=h('div','prog',`<b style="width:${n/qs.length*100}%"></b>`);bar.append(bk);app.append(bar,pr);
    const card=h('div','card');
    if(mode==='pic'){card.append(media(c));card.append(h('div','q','这是哪个字？'))}
    else{const b=h('button','btn','🔊 再听一遍');b.style.background='var(--sky)';b.onclick=()=>say(c);card.append(h('div','q','听一听，是哪个字？'),b);setTimeout(()=>say(c),300)}
    const o=h('div','opts');
    opts.forEach(x=>{const b=h('button','opt han',x);b.onclick=()=>{
      if(card.dataset.lock)return;
      if(x===c){card.dataset.lock=1;b.classList.add('ok');beep(true);right++;S.stars++;S.done[c]=1;save();say(c);setTimeout(()=>{n++;next()},1100)}
      else{b.classList.add('no');beep(false)}}
      o.append(b)});
    card.append(o);app.append(card);
  }
  function end(){
    const e=right>=9?'🏆':right>=6?'🥳':'💪';
    const r=h('div','card result',`<div class="e">${e}</div><div class="q">答对 ${right} / ${qs.length}，得到 ${right} 颗星！</div>`);
    const row=h('div','row');
    const a=h('button','btn','再玩一次');a.style.background='var(--coral)';a.onclick=()=>quiz(mode);
    const b=h('button','btn','回首页');b.style.background='var(--sky)';b.onclick=home;
    row.append(a,b);r.append(row);app.append(r);beep(true);
  }
  next();
}

/* ===== 手绘风图标: 把所有 emoji 换成 OpenMoji 可爱彩色插画 (联网加载，失败则显示原 emoji) ===== */
const ERE=/\p{Extended_Pictographic}(?:\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
const OM='https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/';
const hexOf=e=>[...e].map(c=>c.codePointAt(0).toString(16).toUpperCase()).join('-');
function mkImg(e){
  const i=document.createElement('img');i.className='em';i.alt=e;i.draggable=false;
  let h=hexOf(e),tried=0;i.src=OM+h+'.svg';
  i.onerror=()=>{
    if(!tried&&h.includes('-FE0F')){tried=1;i.src=OM+h.replace(/-FE0F/g,'')+'.svg'}
    else i.replaceWith(document.createTextNode(e));
  };
  return i;
}
function conv(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];
  while(w.nextNode()){const n=w.currentNode;if(!/^(SCRIPT|STYLE|TITLE)$/.test(n.parentNode.nodeName)&&n.nodeValue.search(ERE)>=0)L.push(n)}
  L.forEach(n=>{
    const t=n.nodeValue,f=document.createDocumentFragment();let last=0;
    t.replace(ERE,(m,idx)=>{if(idx>last)f.append(t.slice(last,idx));f.append(mkImg(m));last=idx+m.length});
    if(last<t.length)f.append(t.slice(last));
    n.replaceWith(f);
  });
}
const mo=new MutationObserver(()=>{mo.disconnect();conv(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true})});

function poem(k){
  const p=POEMS[k%POEMS.length];let T=[];
  const ov=h('div','ov'),bx=h('div','card poem'),st=h('div','stage');
  const stop=()=>{T.forEach(clearTimeout);T=[];try{speechSynthesis.cancel()}catch(e){}};
  const close=()=>{stop();ov.remove()};
  function play(){
    stop();
    p.l.forEach((ln,i)=>T.push(setTimeout(()=>{st.innerHTML=`<div class="sc">${p.e[i]}</div><div class="han ln">${ln}</div>`;speakText(ln)},i*4500)));
    T.push(setTimeout(()=>{st.innerHTML='<div class="sc">👏</div><div class="han ln">真棒！</div>'},p.l.length*4500));
  }
  const v=document.createElement('video');v.preload='auto';v.controls=true;v.playsInline=true;v.style.cssText='width:100%;max-height:50vh;border-radius:20px';
  v.onloadeddata=()=>{stop();st.innerHTML='';st.append(v);again.style.display='none'};
  v.src=`assets/video/poem/${p.t}.mp4`;
  const row=h('div','row');
  const again=h('button','btn','🔁 再看一遍');again.style.background='var(--sky)';again.onclick=play;
  const ok=h('button','btn','继续学习');ok.style.background='var(--coral)';ok.onclick=close;
  row.append(again,ok);
  bx.append(h('div','q',`🎬 古诗小剧场：《${p.t}》`),h('div','word',p.a),st,row);
  ov.append(bx);document.body.append(ov);beep(true);play();
}
home();conv(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true});
