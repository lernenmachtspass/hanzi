<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小小识字乐园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F2;--ink:#3D3260;--soft:#8A7FA8;--coral:#FFB3C6;--leaf:#A8E6CF;--sky:#A9D4FF;--plum:#CDB4F6;--sun:#FFE29A;--card:#fff;--line:#F3E4EA;--shadow:0 10px 28px rgba(190,140,170,.2);--glow1:#FFE1EA;--glow2:#D9F4E8}
@media(prefers-color-scheme:dark){:root{--bg:#171630;--ink:#F3F0FF;--soft:#A9A6D3;--card:#25234A;--line:#4A4580;--shadow:0 10px 30px rgba(0,0,0,.35);--glow1:#3A2A5E;--glow2:#24454A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(60% 40% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 40% at 100% 10%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.han{font-family:"Kaiti SC",KaiTi,STKaiti,"楷体",serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:980px;margin:0 auto}
h1{font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:1px}
.stars{background:var(--card);border-radius:99px;padding:8px 18px;font-size:20px;box-shadow:var(--shadow)}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{filter:brightness(1.04)}button:active{transform:scale(.96)}
:focus-visible{outline:4px solid #8E6CF0;outline-offset:3px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:8px}
.big{position:relative;overflow:hidden;border-radius:32px;padding:34px 20px;font-size:32px;color:#3D3260;box-shadow:0 14px 28px rgba(190,140,170,.3);text-align:center}
.big::before,.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.big small{display:block;font-size:17px;margin-top:8px;opacity:.92}
.big .e{font-size:68px;display:block;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.back{background:var(--card);border-radius:99px;padding:9px 20px;font-size:20px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.tab{background:var(--card);border-radius:99px;padding:8px 16px;font-size:18px;white-space:nowrap;box-shadow:var(--shadow);color:var(--soft)}
.tab[aria-pressed=true]{background:var(--plum);color:#3D3260}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.cell{background:var(--card);border-radius:24px;aspect-ratio:1;font-size:46px;position:relative;box-shadow:var(--shadow);color:var(--ink)}
.cell:hover{transform:translateY(-3px)}
.cell.done{background:linear-gradient(160deg,rgba(31,191,152,.18),var(--card))}
.cell.done::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#1B5E4A;font:700 13px/20px sans-serif}
.cell i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:18px}
.card{background:var(--card);border-radius:36px;padding:22px 18px;display:grid;gap:16px;justify-items:center;box-shadow:var(--shadow)}
.media{display:flex;gap:14px;flex-wrap:nowrap;justify-content:center;align-items:center;width:100%}
.pic{width:min(240px,42vw);height:min(240px,42vw);flex:none;border-radius:28px;background:linear-gradient(160deg,#E4F1FF,#FDE9F1);display:grid;place-items:center;overflow:hidden;font-size:min(20vw,110px)}
.pic img,.pic video{width:100%;height:100%;object-fit:contain}
.bigchar{font-size:min(36vw,190px);flex:none;line-height:1;background:linear-gradient(160deg,#FF8FAE,#9A7BF0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.word{font-size:26px;color:var(--soft)}
#writer{touch-action:none;-webkit-user-select:none;user-select:none;width:220px;height:220px;border-radius:18px;border:3px solid #F4A3B8;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 0V100M0 50H100M0 0L100 100M100 0L0 100' stroke='%23F4A3B8' stroke-width='1' stroke-dasharray='4 3' fill='none'/></svg>") center/100% 100% no-repeat}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{position:relative;overflow:hidden;border-radius:99px;padding:13px 26px;font-size:24px;color:#3D3260;box-shadow:0 8px 18px rgba(190,140,170,.3)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;width:100%}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:28px;font-size:68px;padding:14px 0;box-shadow:var(--shadow)}
.opt:hover{border-color:#B79CF5}
.opt.ok{background:#D5F6E8;border-color:#7ED7B6;color:#0B5A44;animation:pop .4s}.opt.no{background:#FFE1E7;border-color:#FF9FB5;color:#7A1F2B;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{height:12px;border-radius:99px;background:var(--line);width:100%;overflow:hidden;margin-bottom:14px}.prog b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A8E6CF,#A9D4FF);transition:width .3s}
.q{font-size:28px;text-align:center;color:var(--ink)}
.result .e{font-size:100px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
img.em{height:1em;width:1em;vertical-align:-.14em;display:inline-block;pointer-events:none}
.pic img.em{width:1em;height:1em;object-fit:initial}
.ov{position:fixed;inset:0;background:rgba(61,50,96,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.poem{max-width:560px;width:100%}
.stage{min-height:240px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;width:100%;background:linear-gradient(160deg,#E4F1FF,#FDE9F1);border-radius:28px;padding:16px;color:#3D3260}
.sc{font-size:110px;line-height:1.1;animation:pop .6s}
.ln{font-size:min(9vw,44px)}
.story-line{line-height:1.8;max-width:100%;overflow-wrap:anywhere}
.story-known{color:#3478C8;font-weight:700}
.story-new{display:inline-block;color:#E44878;font-size:1.42em;font-weight:900;line-height:1.2;text-shadow:0 2px 0 #FFE0EA;margin:0 1px;transform:translateY(1px)}
.cab{background:linear-gradient(160deg,#fff,#F7EFE8);border:8px solid #D4A574;border-radius:24px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;box-shadow:var(--shadow),inset 0 0 0 3px #F0D9BD}
.shelf{display:grid;place-items:center;gap:2px;padding:10px 6px 4px;border-bottom:10px solid #D4A574;background:linear-gradient(160deg,rgba(169,212,255,.25),rgba(255,255,255,.1));border-radius:10px 10px 0 0;min-height:132px;color:#3D3260;text-align:center;font-size:16px}
.shelf svg{width:100%;max-width:150px;height:auto}
.shelf.empty{opacity:.55;font-size:36px;color:#B7A9CF}
.tbig svg{width:min(300px,80vw);height:auto}
#writer svg{touch-action:none}
:root{--t1:#A8E6CF;--t2:#FFE29A}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 45% at 100% 0%,color-mix(in srgb,var(--t1) 55%,transparent),transparent 70%),radial-gradient(70% 45% at 0% 100%,color-mix(in srgb,var(--t2) 50%,transparent),transparent 70%)}
.hr{display:flex;gap:8px;align-items:center}
#thm{color:var(--ink);font-size:18px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;width:100%}
.tcard{border-radius:26px;padding:16px 8px;font-size:22px;color:#3D3260;box-shadow:var(--shadow);border:4px solid transparent}
.tcard.on{border-color:#8E6CF0}
.tcard .te{display:block;font-size:54px;margin-bottom:4px}
.stk{display:grid;place-items:center;width:96px;height:96px;font-size:60px;background:#fff;border-radius:28px;box-shadow:0 0 0 4px #fff,0 0 0 6px #F0DDE8,0 8px 16px rgba(0,0,0,.14)}
.tbig .stk{width:170px;height:170px;font-size:104px;margin:10px}
.shelf .stk{margin:6px 0}
</style>
</head>
<body>
<header><h1>🐣 小小识字乐园</h1><div class="hr"><button class="stars" id="thm"></button><div class="stars" id="stars">⭐ 0</div></div></header>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script>
/* ===== 数据 ===== */
const RAW="一二三四五六七八九十上下左右大小多少土个入人儿火文木禾无口日月天中了子门不开目耳头米见白田电也长山出飞马鸟云公车牛羊巾牙尺毛卜又心风力手水广升足走方半巴业本平书自已东西回片皮生里果几用鱼今正雨两瓜衣来年万百丁齐冬说友话春朋高你绿们花红草爷亲节的岁行古处声知忙洗真认父扫母爸写全完关家看笑着兴画会妈合奶放午收女气太早去亮和李语秀千香听远唱定连向以更后意主总先起干明赶净同专工才级队蚂蚁前房空网诗黄林闭童立是我朵叶美机她过他时送让吗往吧得虫很河借姐呢呀哪谁凉怕量跟最园脸因阳为光可法石找办许别那到都吓叫再做象点像照沙海桥军竹苗井面乡忘想念王这从进边道贝男原爱虾跑吹乐地老快师短淡对热冷情拉活把种给吃练学习非苦常问伴间共伙汽分要没孩位选北湖南秋江只帮星请雪就球跳玩桃树刚兰座各带坐急名发成动晚新有么在变什条哥弟妹叔婶伯姨姑舅外婆宝娃幼青夫妻邻居客己怎样所如但还经能够喜欢好希望觉现记谢系安迎幸福健康勇敢诚实耐礼貌享作轮流排静注危险保护顾尊重温柔善良聪勤劳努难害紧张惊奇怪趣漂丽整洁旧矮胖瘦轻近慢软硬甜酸辣臭鲜饱饿渴累困醒睡梦哭喊讲答读闻摸尝感音颜色形状味事题案结始束昨终于直偶尔些每部其另相化步功失败试仔细坚持准备拾理打清站躺路跃爬翔游泳骑乘停达旅参观探索寻识复忆思考比较择数计算测察验制创造故戏舞蹈歌绘图线圆角字汉拼词句课校操场教室桌椅黑板粉笔包具铅橡剪刀胶纸页封馆阅堂奖品章贴物积棋盘卡拍筝泡熊兔猫狗猪鸡鸭鹅孔雀燕鸽麻乌鸦鹰鹦鹉蝴蝶蜜蜂蜻蜓蜘蛛瓢甲蚯蚓蜗蛙蟾蜍龟蛇蜥蜴鳄恐龙颈鹿狮虎豹猴猩狐狸狼松鼠刺猬驼骆斑犀豚鲸鲨螃蟹螺企金鲤缸池塘泊洋滩岸岛屿谷坡森野农菜植坛根茎枝荫柏柳杨枫银杏梨苹橘柿樱葡萄莓哈密蕉枣橙柚柠檬芒菠萝椰榴蓝覆盆桑葚核玉麦稻饭馒饺蛋糕饼糖巧克冰淇淋酪肉豆腐蔬食餐饮料汁茶厨厅碗筷勺叉杯锅铲箱炉烤壶布抹肥皂液刷膏漱澡梳镜浴厕卧台院屋顶墙壁窗户帘锁钥匙灯插床铺枕被毯柜抽屉架钟历脑视表眼钱伞背服裤裙袜鞋靴帽围套衬衫纽扣链袋棉丝绸紫灰棕透彩虹闪影暗霞霜露雾雷刮晴阴季夏晨傍昏夜周末期份秒度暖炎爽寒预报落旁附央底第途街梁隧铁轨交士租货消防救警垃圾拖挖掘推吊压摩托滑降宇宙船箭卫航员陨器齿扳锤钉砖泥钢属塑玻璃陶瓷革修建寓楼城堡宫殿村庄市镇国世界德牧洞穴瀑泉溪浪滴珠块蒸焰烟尘岩峰脚丛窝巢壳羽翅膀尾睛鼻嘴舌额眉睫脖肩臂掌指肚腰腿膝盖踝趾肤骨肌脏血呼吸身体病医药伤罩喝穿脱蹲伸弯鼓拥抱握挥摇";
const CHARS=[...new Set(RAW)];
const P={一:['🌙','一个月亮'],二:['👀','两只眼睛'],三:['🐷','三只小猪'],四:['🍀','四叶草'],五:['🖐️','五个手指'],六:['🎲','六点'],七:['🌈','七色彩虹'],八:['🐙','八条腿'],九:['🕘','九点钟'],十:['🙌','十个手指'],
上:['⬆️','上面'],下:['⬇️','下面'],左:['⬅️','左边'],右:['➡️','右边'],大:['🐘','大象'],小:['🐜','小蚂蚁'],土:['🪴','泥土'],人:['🧑','大人'],儿:['👶','儿童'],火:['🔥','火焰'],木:['🪵','木头'],禾:['🌾','禾苗'],口:['👄','嘴巴'],日:['☀️','太阳'],月:['🌙','月亮'],天:['🌤️','天空'],子:['👦','孩子'],门:['🚪','大门'],开:['🔓','打开'],目:['👁️','眼睛'],耳:['👂','耳朵'],头:['🙂','头'],米:['🍚','大米'],田:['🌾','稻田'],电:['⚡','闪电'],山:['⛰️','高山'],飞:['✈️','飞机'],马:['🐴','小马'],鸟:['🐦','小鸟'],云:['☁️','白云'],车:['🚗','汽车'],牛:['🐮','奶牛'],羊:['🐑','绵羊'],牙:['🦷','牙齿'],毛:['🧶','毛线'],心:['❤️','爱心'],风:['🌬️','大风'],手:['✋','小手'],水:['💧','水滴'],足:['🦶','脚'],书:['📖','图书'],鱼:['🐟','小鱼'],雨:['🌧️','下雨'],瓜:['🍉','西瓜'],衣:['👕','衣服'],冬:['⛄','冬天'],春:['🌷','春天'],花:['🌸','花朵'],红:['🍓','红色'],绿:['🥬','绿色'],黄:['🍋','黄色'],白:['🥛','白色'],草:['🌱','小草'],家:['🏠','我的家'],看:['👀','看一看'],笑:['😄','笑一笑'],画:['🖼️','画画'],果:['🍎','水果'],听:['🎧','听一听'],唱:['🎤','唱歌'],写:['✍️','写字'],洗:['🧼','洗手'],爸:['👨','爸爸'],妈:['👩','妈妈'],奶:['👵','奶奶'],爷:['👴','爷爷'],女:['👧','女孩'],男:['👦','男孩'],蚂:['🐜','蚂蚁'],蚁:['🐜','蚂蚁'],房:['🏡','房子'],网:['🕸️','蜘蛛网'],林:['🌳','树林'],叶:['🍃','树叶'],树:['🌲','大树'],朵:['🌼','花朵'],虫:['🐛','毛毛虫'],河:['🏞️','小河'],脸:['🙂','小脸'],光:['💡','灯光'],石:['🪨','石头'],海:['🌊','大海'],桥:['🌉','大桥'],竹:['🎋','竹子'],井:['⛲','水井'],王:['👑','国王'],爱:['💕','爱你'],虾:['🦐','小虾'],跑:['🏃','跑步'],吹:['🎈','吹气球'],吃:['🍽️','吃饭'],球:['⚽','足球'],桃:['🍑','桃子'],星:['⭐','星星'],雪:['❄️','下雪'],湖:['🦆','湖水'],汽:['🚌','汽车'],玩:['🧸','玩具'],跳:['🤸','跳高'],笔:['🖊️','笔'],南:['🧭','南方'],北:['🧭','北方'],东:['🌅','东方'],西:['🌇','西方'],秋:['🍂','秋天'],热:['🥵','很热'],冷:['🥶','很冷'],快:['🐇','快跑'],老:['🧓','老人'],亮:['🌟','明亮'],明:['💡','明亮'],美:['🌺','美丽'],园:['🏞️','公园'],座:['💺','座位'],帽:['🧢','帽子']};
const LV=[];for(let i=0;i<CHARS.length;i+=12)LV.push(CHARS.slice(i,i+12));
const PIC=CHARS.filter(c=>P[c]);

/* ===== 状态 ===== */
const $=s=>document.querySelector(s),app=$('#app');
const blank=()=>({done:{},stars:0,rewarded:0,lib:[],coll:[]});
let S={theme:'train',themeChosen:false,done:{},stars:0,rewarded:0,lib:[],coll:{}},ALL={};
try{
  const r=JSON.parse(localStorage.getItem('hanzi')||'{}');
  if(r.v===2){S.theme=r.theme||'train';S.themeChosen=!!r.themeChosen;ALL=r.data||{}}
}catch(e){}
function loadTheme(){const d=ALL[S.theme]||blank();S.done=d.done||{};S.stars=d.stars||0;S.rewarded=d.rewarded||0;S.lib=d.lib||[];S.coll={[S.theme]:d.coll||[]}}
loadTheme();
const save=()=>{ALL[S.theme]={done:S.done,stars:S.stars,rewarded:S.rewarded,lib:S.lib,coll:S.coll[S.theme]||[]};try{localStorage.setItem('hanzi',JSON.stringify({v:2,theme:S.theme,themeChosen:S.themeChosen,data:ALL}))}catch(e){}$('#stars').textContent='⭐ '+S.stars};
save();
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};

/* ===== 声音 ===== */
let CUR,M={};
fetch('assets/audio/manifest.json').then(r=>r.ok?r.json():{}).then(j=>{M=j||{}}).catch(()=>{});
function silence(){try{speechSynthesis.cancel()}catch(e){}try{CUR&&CUR.pause()}catch(e){}}
function say(c){speakText(P[c]?`${c}。${P[c][1]}`:c)}
function speakText(w,rate,onend){
  silence();
  let finished=false,backup=null;
  const done=()=>{if(finished)return;finished=true;if(backup)clearTimeout(backup);if(typeof onend==='function')onend()};
  backup=setTimeout(done,Math.max(5000,String(w||'').length*850));
  if(M[w]){
    const a=new Audio('assets/audio/'+M[w]);CUR=a;
    a.onended=done;a.onerror=()=>tts(w,rate,done);a.play().catch(()=>tts(w,rate,done));return;
  }
  tts(w,rate,done);
}
function bestVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/zh|cmn/i.test(v.lang));
  const sc=v=>/natural|neural|online/i.test(v.name)?5:/premium|enhanced|siri|xiaoxiao|xiaoyi|yunxi/i.test(v.name)?4:/google/i.test(v.name)?3:/tingting|meijia|huihui|female|女/i.test(v.name)?2:1;
  return vs.sort((x,y)=>sc(y)-sc(x))[0];
}
function tts(w,rate,onend){
  try{
    const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';
    const v=bestVoice();if(v)u.voice=v;
    u.pitch=1;u.rate=rate||.65;
    let fired=false;const finish=()=>{if(fired)return;fired=true;if(typeof onend==='function')onend()};
    u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);
  }catch(e){if(typeof onend==='function')onend()}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=ok?[660,880,1100]:[220];n.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.15)})}catch(e){}}

let writer;
function showCard(lv,i){
  const list=LV[lv],c=list[i];S.done[c]=1;save();say(c);
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 返回');bk.onclick=()=>learn(lv);bar.append(bk,h('span','q',`${i+1} / ${list.length}`));app.append(bar);
  const card=h('div','card');
  const m=h('div','media');m.append(media(c));
  const big=h('div','bigchar han',c);m.append(big);card.append(m);
  if(P[c])card.append(h('div','word',P[c][1]));
  const w=h('div','');w.id='writer';card.append(w);
  const tip=h('div','word','点「描红」，用手指描一描');card.append(tip);
  const r=h('div','row');
  const mk=(t,col,f)=>{const b=h('button','btn',t);b.style.background=col;b.onclick=f;r.append(b)};
  mk('🔊 听','var(--sky)',()=>say(c));
  mk('▶️ 笔顺','var(--plum)',()=>{try{writer.cancelQuiz()}catch(e){}tip.textContent='看一看，笔画是这样写的';anim()});
  mk('🖍️ 描红','var(--leaf)',()=>trace());
  if(i>0)mk('⬅️','var(--leaf)',()=>card_(lv,i-1));
  mk(i<list.length-1?'下一个 ➡️':'🎉 完成本关','var(--coral)',()=>{
    if(i<list.length-1)return card_(lv,i+1);
    // 完成整关：解锁古诗（每关1首）；若本关是第3/6/9…关，额外解锁故事
    beep(true);unlockAndPlay(lv);
  });
  card.append(r);app.append(card);
  function anim(){try{writer.animateCharacter()}catch(e){}}
  function trace(){try{
    writer.cancelQuiz();
    writer.quiz({leniency:1.6,showHintAfterMisses:2,highlightOnComplete:true,onComplete:()=>{beep(true);tip.textContent='太棒了，描好啦！🎉 点「描红」再描一次'}});
    tip.textContent='用手指沿着浅色的字，一笔一笔描';
  }catch(e){}}
  try{writer=HanziWriter.create('writer',c,{width:220,height:220,padding:16,strokeColor:'#FF7FA0',radicalColor:'#7FB6F5',strokeAnimationSpeed:.5,delayBetweenStrokes:600,showOutline:true,outlineColor:'#E3CFD9',drawingWidth:18,drawingColor:'#FF7FA0',highlightColor:'#7ED7B6',onLoadCharDataError:()=>{w.style.display='none'}});anim()}catch(e){w.style.display='none'}
  function card_(a,b){showCard(a,b)}
}

/* ===== 关末解锁：每关古诗；每3关故事 ===== */
function unlockAndPlay(level){
  const T=curTheme();
  const pi=lessonPoem(T.id,level);
  addLib('p:'+pi);
  const isStoryLevel=(level+1)%3===0; // 第3、6、9…关
  let si=null;
  if(isStoryLevel){si=Math.min(Math.floor(level/3),29);addLib(`s:${T.id}:${si}`);}
  const after=()=>{
    if(si!=null)storyTheater(T.id,si,()=>learn(level));
    else learn(level);
  };
  poemTheater(pi,si!=null?{label:`${T.n}小故事`,fn:()=>storyTheater(T.id,si,()=>learn(level))}:{label:'回学习',fn:()=>learn(level)});
}

function quiz(mode){
  const learned=CHARS.filter(c=>S.done[c]);
  const pool=mode==='pic'?learned.filter(c=>P[c]):learned;
  const base=mode==='pic'?PIC:CHARS;
  if(!pool.length){
    app.innerHTML='';
    const m=h('div','card result',`<div class="e">📚</div><div class="q">还没有学过的字，先去学习吧！</div>`);
    const b=h('button','btn','去学习');b.style.background='var(--sky)';b.onclick=()=>learn(0);m.append(b);app.append(m);return;
  }
  const qs=shuffle(pool).slice(0,15);let n=0,right=0;
  function next(){
    app.innerHTML='';
    if(n>=qs.length)return end();
    const c=qs[n];
    const others=[...new Set([...shuffle(pool.filter(x=>x!==c)),...shuffle(base.filter(x=>x!==c))])].slice(0,2);
    const opts=shuffle([c,...others]);
    const bar=h('div','bar');const bk=h('button','back','← 退出');bk.onclick=testMenu;
    const pr=h('div','prog',`<b style="width:${n/qs.length*100}%"></b>`);bar.append(bk);app.append(bar,pr);
    const card=h('div','card');
    if(mode==='pic'){card.append(media(c));card.append(h('div','q','这是哪个字？'))}
    else{const b=h('button','btn','🔊 再听一遍');b.style.background='var(--sky)';b.onclick=()=>say(c);card.append(h('div','q','听一听，是哪个字？'),b);setTimeout(()=>say(c),900)}
    const o=h('div','opts');
    opts.forEach(x=>{const b=h('button','opt han',x);b.onclick=()=>{
      if(card.dataset.lock)return;
      if(x===c){card.dataset.lock=1;b.classList.add('ok');beep(true);right++;S.stars++;save();say(c);setTimeout(()=>{n++;next()},1900)}
      else{b.classList.add('no');beep(false)}}
      o.append(b)});
    card.append(o);app.append(card);
  }
  function end(){
    const e=right>=9?'🏆':right>=6?'🥳':'💪';
    const r=h('div','card result',`<div class="e">${e}</div><div class="q">答对 ${right} / ${qs.length}，得到 ${right} 颗星！</div>`);
    const row=h('div','row');
    const a=h('button','btn','再玩一次');a.style.background='var(--coral)';a.onclick=()=>quiz(mode);
    const b=h('button','btn','回首页');b.style.background='var(--sky)';b.onclick=home;
    row.append(a,b);r.append(row);app.append(r);beep(true);setTimeout(giveSticker,900);
  }
  next();
}

/* ===== emoji 转插画 ===== */
const ERE=/\p{Extended_Pictographic}(?:\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
const OM='https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/';
const hexOf=e=>[...e].map(c=>c.codePointAt(0).toString(16).toUpperCase()).join('-');
function mkImg(e){
  const i=document.createElement('img');i.className='em';i.alt=e;i.draggable=false;
  let h=hexOf(e),tried=0;i.src=OM+h+'.svg';
  i.onerror=()=>{if(!tried&&h.includes('-FE0F')){tried=1;i.src=OM+h.replace(/-FE0F/g,'')+'.svg'}else i.replaceWith(document.createTextNode(e))};
  return i;
}
function conv(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];
  while(w.nextNode()){const n=w.currentNode;if(!/^(SCRIPT|STYLE|TITLE)$/.test(n.parentNode.nodeName)&&n.nodeValue.search(ERE)>=0)L.push(n)}
  L.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let last=0;
    t.replace(ERE,(m,idx)=>{if(idx>last)f.append(t.slice(last,idx));f.append(mkImg(m));last=idx+m.length});
    if(last<t.length)f.append(t.slice(last));n.replaceWith(f);});
}
const mo=new MutationObserver(()=>{mo.disconnect();conv(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true})});

/* 每 3 关共用 1 篇故事；不足时回落最后一篇 */
function storyFor(themeId,level){
  const arr=STORY_BOOK[themeId]||STORY_BOOK.animals;
  const idx=Math.min(Math.floor(level/3),arr.length-1);
  return {idx,b:arr[idx]};
}
function storyScenes(b,themeEmoji){
  return [[themeEmoji,b[1]],[themeEmoji,b[2]],[themeEmoji,b[3]],[themeEmoji,b[4]]];
}
const curTheme=()=>THEMES.find(t=>t.id===S.theme)||THEMES[0];
function applyTheme(){
  const T=curTheme(),r=document.documentElement.style;
  r.setProperty('--t1',T.t[0]);r.setProperty('--t2',T.t[1]);
  $('#thm').textContent=`${T.i} ${T.n}`;
}
const pr=id=>{const d=id===S.theme?S:(ALL[id]||blank());return{n:Object.keys(d.done||{}).length,s:d.stars||0}};
function pickTheme(first){
  const ov=h('div','ov'),bx=h('div','card poem'),g=h('div','tgrid');
  THEMES.forEach(T=>{
    const b=h('button','tcard'+(T.id===S.theme?' on':''),`<span class="te">${T.i}</span>${T.n}<small style="display:block;font-size:14px;opacity:.8;margin-top:4px">已学 ${pr(T.id).n} 字 · ⭐${pr(T.id).s}</small>`);
    b.style.background=`linear-gradient(160deg,${T.t[0]},${T.t[1]})`;
    b.onclick=()=>{if(T.id!==S.theme){save();S.theme=T.id;loadTheme()}S.themeChosen=true;save();applyTheme();ov.remove();home()};
    g.append(b);
  });
  bx.append(h('div','q','🎨 选一个喜欢的主题'),h('div','word','主题会换成对应的奖励故事和贴纸'),g);
  if(!first){const c=h('button','btn','关闭');c.style.background='var(--sky)';c.onclick=()=>ov.remove();bx.append(c)}
  ov.append(bx);document.body.append(ov);
}
function escapeStoryText(text){return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function storyTextHTML(text){
  const learned=new Set(Object.keys(S.done||{}));
  return Array.from(String(text)).map(ch=>{
    const safe=escapeStoryText(ch);
    if(learned.has(ch))return `<span class="story-known">${safe}</span>`;
    return safe;
  }).join('');
}
function theater(o){
  let timers=[],runId=0;
  const ov=h('div','ov'),bx=h('div','card poem'),st=h('div','stage');
  const stop=()=>{runId++;timers.forEach(clearTimeout);timers=[];silence()};
  const close=()=>{stop();ov.remove()};
  const wait=(ms,fn)=>{const id=setTimeout(fn,ms);timers.push(id)};
  function play(){
    stop();const myRun=runId;st.innerHTML='';
    const valid=()=>myRun===runId&&ov.isConnected;
    const showScene=(sc)=>{
      if(!valid())return;
      const line=o.highlight?storyTextHTML(sc[1]):escapeStoryText(sc[1]);
      st.innerHTML=`<div class="sc">${sc[0]}</div><div class="han ln story-line">${line}</div>`;
      speakText(sc[1],o.rate,()=>{if(valid())wait(350,()=>nextScene())});
    };
    let index=0;
    const nextScene=()=>{
      if(!valid())return;
      if(index>=o.scenes.length){st.innerHTML='<div class="sc">👏</div><div class="han ln">真棒！</div>';return}
      showScene(o.scenes[index++]);
    };
    st.innerHTML=`<div class="sc">${o.icon}</div><div class="han ln">《${o.title}》</div><div class="word">${o.sub||''}</div>`;
    speakText(o.title+(o.sub?'，'+o.sub:''),o.rate,()=>{if(valid())nextScene()});
  }
  const row=h('div','row');
  const again=h('button','btn','🔁 再看一遍');again.style.background='var(--sky)';again.onclick=play;
  const ok=h('button','btn',o.nextLabel);ok.style.background='var(--coral)';ok.onclick=()=>{close();o.next&&o.next()};
  row.append(again,ok);
  bx.append(h('div','q',o.head),st,row);ov.append(bx);document.body.append(ov);beep(true);play();
}
const PO={princess:0,train:1,unicorn:2,transport:3,construction:4,space:5,dino:6,animals:7};

function addLib(k){if(!S.lib.includes(k)){S.lib.push(k);save()}}
function poemTheater(pi,next){
  const p=POEMS[pi];addLib('p:'+pi);
  theater({head:'🎬 古诗小剧场',icon:'📜',title:p.t,sub:p.a,scenes:p.l.map((l,j)=>[p.e[j],l]),rate:.85,nextLabel:next?next.label:'关闭',next:next&&next.fn});
}
function storyTheater(tid,si,nextLabel){
  const T=THEMES.find(x=>x.id===tid),{b}=storyFor(tid,si*3),sc=storyScenes(b,T.i);
  addLib(`s:${tid}:${si}`);
  theater({head:`${T.i} ${T.n}小故事`,icon:T.i,title:b[0],sub:'',scenes:sc,highlight:true,rate:.75,nextLabel:nextLabel||'关闭',next:nextLabel&&nextLabel.fn});
}
function library(){
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 首页');bk.onclick=home;bar.append(bk,h('span','q','🎞️ 我的视频库'));app.append(bar);
  const items=S.lib.map(k=>{
    const [t,a,b]=k.split(':');
    if(t==='p'){const p=POEMS[+a];return p&&{e:'📜',t:p.t,s:'古诗 · '+p.a,bg:'linear-gradient(160deg,#FFE29A,#FFD9A8)',f:()=>poemTheater(+a)}}
    const T=THEMES.find(x=>x.id===a);if(!T)return null;
    const {b:bb}=storyFor(a,(+b)*3);
    return {e:T.i,t:bb[0],s:T.n+'小故事',bg:`linear-gradient(160deg,${T.t[0]},${T.t[1]})`,f:()=>storyTheater(a,+b)};
  }).filter(Boolean);
  if(!items.length){app.append(h('p','q','完成一关，就会解锁一首古诗 🎁'));return}
  app.append(h('p','q',`已解锁 ${items.length} 个，点一下就能再看`));
  const g=h('div','tgrid');
  items.forEach(it=>{const b=h('button','tcard',`<span class="te">${it.e}</span>${it.t}<small style="display:block;font-size:15px;opacity:.8;margin-top:4px">${it.s}</small>`);b.style.background=it.bg;b.onclick=it.f;g.append(b)});
  app.append(g);
}

  const mouth=t.f?`<path d="M50 46 Q55 56 60 46Z" fill="#FF8FAE" stroke="#3D3260" stroke-width="1.5" stroke-linejoin="round"/>`:`<path d="M50 47 Q55 52 60 47" stroke="#3D3260" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const wheel=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c3}" ${L}/><circle cx="${x}" cy="${y}" r="${r/3}" fill="#fff"/>`;
  return `<svg viewBox="0 -12 130 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t.n}">
<circle cx="40" cy="-3" r="5" fill="#fff" stroke="#E2D8F3" stroke-width="2"/><circle cx="49" cy="-8" r="4" fill="#fff" stroke="#E2D8F3" stroke-width="2"/><circle cx="57" cy="-4" r="3" fill="#fff" stroke="#E2D8F3" stroke-width="2"/>

}
const artOf=it=>it.tr?trainSVG(it.tr):`<div class="stk" style="transform:rotate(${it.r||0}deg)">${it.e}</div>`;
const totalColl=()=>Object.values(S.coll).reduce((a,b)=>a+b.length,0);
function giveSticker(){
  if(totalColl()>=Math.floor(S.stars/24))return;
  const T=curTheme(),list=S.coll[T.id]=S.coll[T.id]||[];let it;
  if(!T.stk){const t=newTrain();it={tr:t,n:t.n}}
  else{
    const own=new Set(list.map(x=>x.e)),pool=T.stk.filter(x=>!own.has(x[0])),src=pool.length?pool:T.stk,p=src[Math.floor(Math.random()*src.length)];
    it={e:p[0],n:p[1],r:Math.floor(Math.random()*13)-6};
  }
  list.push(it);save();beep(true);
  const ov=h('div','ov'),bx=h('div','card poem');
  const ok=h('button','btn','放进收藏柜 '+T.i);ok.style.background='var(--coral)';ok.onclick=()=>{ov.remove();museum()};
  bx.append(h('div','q','🎉 得到新贴纸啦！'),h('div','tbig',artOf(it)),h('div','q',it.n),ok);
  ov.append(bx);document.body.append(ov);setTimeout(()=>speakText(it.n),500);
}
function museum(){
  const T=curTheme(),list=S.coll[T.id]||[];
  app.innerHTML='';
  const bar=h('div','bar');const bk=h('button','back','← 首页');bk.onclick=home;bar.append(bk,h('span','q',`${T.i} 我的${T.coll}`));app.append(bar);
  app.append(h('p','q',`已收集 ${list.length} 个 · 再得 ${24-S.stars%24} 颗星，就有新贴纸`));
  const cab=h('div','cab'),slots=Math.max(6,Math.ceil((list.length+1)/3)*3);
  for(let i=0;i<slots;i++){const it=list[i];cab.append(it?h('div','shelf',artOf(it)+`<span>${it.n}</span>`):h('div','shelf empty','❔'))}
  app.append(cab);giveSticker();
}

applyTheme();$('#thm').onclick=()=>pickTheme(false);home();conv(document.body);if(!S.themeChosen)pickTheme(true);mo.observe(document.body,{childList:true,subtree:true,characterData:true});
